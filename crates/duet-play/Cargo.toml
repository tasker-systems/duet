[package]
name = "duet-play"
version.workspace = true
description = "Play a duet Part: the timed MIDI events it sounds as, and a SoundFont synth that renders them."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["midi", "music", "soundfont", "synthesizer"]
categories = ["multimedia::audio"]
# The tests read the workspace's samples, so they stay out of the package.
include = ["src/**", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
duet-core.workspace = true
duet-midi.workspace = true
midly = "0.5.3"
rustysynth = "1.3.8"
thiserror = "2"

# The duet-abc corpus: our own tunes, MIT, and the abc2midi run that recorded its readings.
#
# Each tune has three committed files beside it: <name>.abc2midi.txt (abc2midi's reading of
# the tune), <name>.written.abc (our writer's ABC for it, write(read(tune))) and
# <name>.written.abc2midi.txt (abc2midi's reading of that). A reading is the notefmt text
# of abc2midi's MIDI, read through duet-midi exactly as read. tests/oracle.rs compares
# them with our reading, note by note (tick, length, pitch, channel, velocity), then the
# tempo map and each channel's program; see it for how to re-record.
#
# A tune the writer refuses gives `writer_refuses` and its reason. It has no written files,
# and the tests check that the writer still refuses it.
#
# A listed difference is a [[tune.difference]] with `what` (velocity, start, length,
# channel, extra-note or missing-note), `notes` (all, or a range of our positions such as
# "3.1.0..5.1.0"), the exact `ours` and `theirs`, and a `reason`. It is subtracted exactly,
# and a listed difference that no longer occurs fails the test.

# What `abc2midi -ver` prints. The recordings were made with this version, and the local
# oracle run fails on any other.
abc2midi_version = "5.10 November 11 2026 abc2midi"
# Inserted after the tune's X: line, and again at each voice in its body (after a V: line,
# or as [I:...] fields after an inline [V:]): abc2midi starts each voice's playback
# settings afresh, so a preamble in the header reaches the first voice only. nobeataccents gives every note the dynamic's level;
# ratio 3 1 pins broken rhythm to the standard's dotted reading; chordattack 0 starts a
# chord's notes together instead of 10 ticks apart.
preamble = ["%%MIDI nobeataccents", "%%MIDI ratio 3 1", "%%MIDI chordattack 0"]
# After `abc2midi <file> <X> -o <out.mid>`. No -silent, which can hide warnings.
arguments = ["-Q", "120"]

[[tune]]
name = "header-fields"
file = "header-fields.abc"
x = 1
provenance = "our own, written for the corpus"
constructs = ["X:, T:, M:, L:, Q:, K:", "% comment at the end of a field line", "comment line", "[r:remark]", "information fields A:, B:, C:, D:, F:, G:, H:, N:, O: and Z: (notice)", "I: (notice)"]


[package]
name = "duet-cli"
version = "0.1.0"
description = "duet: compose with an LLM in text both can read, and convert it to and from MIDI."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["midi", "music", "notation", "llm"]
categories = ["multimedia::audio", "command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "duet"
path = "src/main.rs"

[dependencies]
duet-core = { path = "../duet-core", version = "0.1.0" }
duet-midi = { path = "../duet-midi", version = "0.1.0" }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

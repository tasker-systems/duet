[package]
name = "duet-cli"
version.workspace = true
description = "duet: compose with an LLM in text both can read, and convert it to and from MIDI."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["midi", "music", "notation", "llm"]
categories = ["multimedia::audio", "command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "duet"
path = "src/main.rs"

[dependencies]
duet-core.workspace = true
duet-midi.workspace = true
duet-drums.workspace = true
duet-abc.workspace = true
duet-capture.workspace = true
duet-play.workspace = true
duet-schemas.workspace = true
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
etcetera = "0.11"
serde = { version = "1", features = ["derive"] }
# duet play: audio out, and MIDI ports. On Linux both need the ALSA headers to build.
cpal = "0.18.2"
midir = "0.11.1"
# duet play --port: on Ctrl-C, the port is sent note-offs so nothing is left sounding.
ctrlc = "3.5.2"

[features]
# `duet capture melody --reader basic-pitch`: Spotify's Basic Pitch, its model embedded.
default = ["basic-pitch"]
basic-pitch = ["duet-capture/basic-pitch"]

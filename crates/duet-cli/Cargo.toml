[package]
name = "duet-cli"
version.workspace = true
description = "duet: compose with an LLM in text both can read, and convert it to and from MIDI."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["midi", "music", "notation", "llm"]
categories = ["multimedia::audio", "command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "duet"
path = "src/main.rs"

[dependencies]
duet-actions.workspace = true
duet-core.workspace = true
duet-schemas.workspace = true
duet-bus.workspace = true
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[features]
# `duet capture melody --reader basic-pitch`: Spotify's Basic Pitch, its model embedded.
default = ["basic-pitch"]
basic-pitch = ["duet-actions/basic-pitch"]

[dev-dependencies]
# The in-process tests (src/tests.rs) build drum grids to drive the CLI with.
duet-drums.workspace = true

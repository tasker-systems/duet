[package]
name = "duet-cli"
version = "0.2.1"
description = "duet: compose with an LLM in text both can read, and convert it to and from MIDI."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["midi", "music", "notation", "llm"]
categories = ["multimedia::audio", "command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "duet"
path = "src/main.rs"

[dependencies]
duet-core = { path = "../duet-core", version = "0.2.0" }
duet-midi = { path = "../duet-midi", version = "0.2.0" }
duet-drums = { path = "../duet-drums", version = "0.2.0" }
duet-abc = { path = "../duet-abc", version = "0.2.0" }
duet-capture = { path = "../duet-capture", version = "0.2.0" }
duet-play = { path = "../duet-play", version = "0.2.0" }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
etcetera = "0.11"
serde = { version = "1", features = ["derive"] }
# duet play: audio out, and MIDI ports. On Linux both need the ALSA headers to build.
cpal = "0.18.2"
midir = "0.11.1"
# duet play --port: on Ctrl-C, the port is sent note-offs so nothing is left sounding.
ctrlc = "3.5.2"

[package]
name = "duet-e2e"
# Never published and never released: the version is a placeholder, not the workspace's.
version = "0.0.0"
description = "End-to-end tests of the duet binary: each run builds it, then drives it."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Reads cargo's build messages to find the binary it just built.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
# The capture tests read back the .notes and .drums duet writes, with the readers duet uses.
duet-core.workspace = true
# A take written as `duet record` writes it, to capture it as the owner would.
duet-capture.workspace = true
duet-drums.workspace = true
# The capture tests read back the documents duet writes, with the reader duet uses.
duet-schemas.workspace = true
# The journal tests read a project's journal as duet does.
duet-bus.workspace = true
# The tests compare written MIDI event by event, and JSON and TOML as values.
midly = "0.5.3"
toml = "1"
# Validates the documents duet writes against their committed schemas, envelope included. No
# default features: no HTTP or file resolver.
jsonschema = { version = "0.62.0", default-features = false }

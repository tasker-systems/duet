# The duet-capture reference corpus: recorded takes, each with a hand-checked transcription.
#
# tests/corpus.rs runs every take here through the library pipeline (FileSource, Prepare,
# Melody or Hits, estimate, assemble), quantizes the result and the `expected` file to the
# take's grid, and compares them. It does not run the `duet` binary. A melody take is aligned
# by the step each note starts on: every expected note of at least an eighth needs a found note
# of at least an eighth on its step with its pitch (to the semitone), and a found note of at
# least an eighth on a step the transcription has no note on fails; shorter notes are reported
# only. A rhythm take must match as a set of (step, key): no missing and no extra hit; a tapped
# take's hits are all the asked lane's key, and a beatboxed take's keys are the lanes kick,
# snare and hh as marked by hand.
# Lane names are those of the gm lane map.
#
# These takes witness the goal clauses a-sung-melody-file-reaches-abc,
# a-tapped-rhythm-file-reaches-a-drum-grid and a-beatboxed-hit-lands-in-the-drum-it-imitates,
# and only the owner's recordings do. A take whose provenance starts "synthetic" is made by
# scripts/capture-fixtures.sh; it proves the harness bites and witnesses no goal clause, and
# every_kind_has_a_reference_take (ignored until the owner's takes land) does not count it.
#
# A [[take]] has:
#   file        the recording, beside this manifest (FLAC or Ogg, a few seconds)
#   kind        "melody", "tapped" or "beatboxed"
#   provenance  who made it and how ("synthetic, generated" for a generated one)
#   licence     what it may be published under
#   expected    the hand-checked transcription, a .notes file beside it
#   lane        a tapped take's asked lane (name or alias in the gm map); required for a
#               tapped take and refused on any other kind
#   tempo, meter, downbeat, key
#               optional given timing (bpm, "4/4", seconds into the file, an ABC key name);
#               left out, the pipeline estimates it, as `duet capture` does
#   grid        optional quantize grid for the comparison, default "1/16"

[[take]]
file = "synthetic-melody.flac"
kind = "melody"
provenance = "synthetic, generated"
licence = "MIT"
expected = "synthetic-melody.notes"
tempo = 120.0
meter = "4/4"
downbeat = 0.25

[[take]]
file = "synthetic-beatbox.flac"
kind = "beatboxed"
provenance = "synthetic, generated"
licence = "MIT"
expected = "synthetic-beatbox.notes"
tempo = 120.0
meter = "4/4"
downbeat = 0.25

# A [[listened]] is a recorded melody the owner has listened to and judged by ear, with no
# note-by-note transcription. tests/corpus.rs reads it as `duet capture melody` does with
# nothing given (the note HMM, timing, tuning and key estimated) and holds only what the owner
# agreed, each within its tolerance. It witnesses no goal clause.
#   file          the recording, beside this manifest
#   provenance    what it is, who made it, when and how
#   licence       what it may be published under
#   licence_file  the licence notice, beside the recording
#   digest        the take's digest: the SHA-256 of its decoded samples, as `duet capture`
#                 states it in `take.digest` (capture-analysis 1.13), so a file that is not this
#                 take fails by name
#   key           the estimated key, as ABC names it in `K:`
#   tuning_cents, tuning_within
#                 the estimated A4's offset from 440 Hz, in cents, and how far it may move
#   notes, notes_within
#                 how many notes the HMM reads, and how far that may move
#   excursions, excursions_within
#                 how many excursions the HMM's notes hold in all, and how far that may move

[[listened]]
file = "wayfaring-stranger.flac"
provenance = "The owner's recording of the traditional song Wayfaring Stranger, sung by James (Pete) Taylor, recorded 2026-11-15 with `duet record` (48 kHz 24-bit) and resampled to 22.05 kHz 16-bit mono"
licence = "CC-BY-4.0"
licence_file = "wayfaring-stranger.flac.license"
# 22 050 Hz, 1 channel, 488 040 frames. Checked against ffmpeg's decode, hashed apart from duet.
digest = "sha256:18148cfcdb5331d7f4c4a9e0e5b00383f463beda7c8c820da872872af1ec7cae"
# E-flat minor, ruled by the owner (2026-11-17, temper task 01a1e95b): three of the four
# phrases and the last note rest on E-flat, and G-flat is held where G is only an approach. The
# Aarden-Essen profile reads it so under every reader, before and after the held-pitch pass;
# Krumhansl-Kessler, duet's profile until then, read E-flat or A-flat major. v1 has major and
# minor only, so its Dorian C is an accidental.
key = "Ebm"
tuning_cents = -7.0
tuning_within = 3.0
# 38 since the held-pitch pass (2026-11-17): the HMM's 30, and the eight pitches held before
# the note they reach that the owner ruled on (temper task 01a1e4f9, the moments in
# wayfaring-stranger.moments). With those notes, the 13 excursions left are the ornaments
# inside notes and the pitches held above the note they reach.
notes = 38
notes_within = 2
excursions = 13
excursions_within = 2

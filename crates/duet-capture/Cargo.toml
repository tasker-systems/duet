[package]
name = "duet-capture"
version = "0.2.0"
description = "duet capture: audio in, analysis events out, as a stream of stages that settle their output as they go."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["midi", "music", "audio", "llm"]
categories = ["multimedia::audio"]
include = ["src/**", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
audioadapter-buffers = "5.2.0"
rubato = "5.1.0"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "wav", "ogg", "pcm"] }
thiserror = "2"

[dev-dependencies]
rustfft = "6.4.1"
serde_json = "1"

[package]
name = "duet-capture"
version = "0.2.0"
description = "duet capture: audio in, analysis events out, as a stream of stages that settle their output as they go."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["midi", "music", "audio", "llm"]
categories = ["multimedia::audio"]
include = ["src/**", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
audioadapter-buffers = "5.2.0"
duet-abc = { path = "../duet-abc", version = "0.2.0" }
duet-core = { path = "../duet-core", version = "0.2.0" }
duet-drums = { path = "../duet-drums", version = "0.2.0" }
rubato = "5.1.0"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "flac", "id3v1", "id3v2", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2"

[dev-dependencies]
pyin = "1.2.0"
serde_json = "1"
toml = "1"

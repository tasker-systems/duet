[package]
name = "duet-capture"
version.workspace = true
description = "duet capture: audio files in, a Song out. Decodes takes through Symphonia, runs duet-dsp's analysis and assembles the events."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["midi", "music", "audio", "llm"]
categories = ["multimedia::audio"]
include = ["src/**", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
duet-abc.workspace = true
duet-core.workspace = true
duet-drums.workspace = true
duet-dsp.workspace = true
# The analysis types derive their schema here: duet-schemas commits it as capture-analysis 1.0.
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "flac", "id3v1", "id3v2", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2"
# duet record: a take is written as FLAC a frame at a time. Default features are off: they add
# threading, serde and logging the writer does not use.
flacenc = { version = "0.5.1", default-features = false }

[dev-dependencies]
# tests/flex_pitch.rs reads the corpus's outside transcription, a MIDI file.
duet-midi.workspace = true
rustfft = "6.4.1"
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"

[features]
# The basic-pitch reader, with its model embedded (duet-dsp's `basic-pitch`).
basic-pitch = ["duet-dsp/basic-pitch"]

[package]
name = "duet-capture"
version = "0.2.0"
description = "duet capture: audio files in, a Song out. Decodes takes through Symphonia, runs duet-dsp's analysis and assembles the events."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["midi", "music", "audio", "llm"]
categories = ["multimedia::audio"]
include = ["src/**", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
duet-abc = { path = "../duet-abc", version = "0.2.0" }
duet-core = { path = "../duet-core", version = "0.2.0" }
duet-drums = { path = "../duet-drums", version = "0.2.0" }
duet-dsp = { path = "../duet-dsp", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "flac", "id3v1", "id3v2", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2"

[dev-dependencies]
rustfft = "6.4.1"
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"

[package]
name = "duet-roadmap"
# Never published and never released: a tool for the repository's own roadmap, not part of duet.
version = "0.0.0"
description = "Draws duet's roadmap snapshot from the Temper records, as a new dated research resource."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The `temper` CLI answers in JSON.
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[package]
name = "duet-midi"
version.workspace = true
description = "Read and write Standard MIDI Files as duet Parts, exactly."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["midi", "music", "notation", "llm"]
categories = ["multimedia::audio", "parser-implementations"]

[lints]
workspace = true

[dependencies]
duet-core.workspace = true
midly = "0.5.3"
thiserror = "2"

[dev-dependencies]
duet-dsp = { path = "../duet-dsp" }
duet-schemas = { path = "../duet-schemas" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[package]
name = "duet-dsp"
version = "0.2.0"
description = "duet's audio analysis: samples in, events out, as a stream of stages that settle their output as they go. No I/O, codecs or formats."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["music", "audio", "dsp", "pitch", "onset"]
categories = ["multimedia::audio"]
include = ["src/**", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
audioadapter-buffers = "5.2.0"
duet-core = { path = "../duet-core", version = "0.2.0" }
rubato = "5.1.0"
rustfft = "6.4.1"
# The performance types derive their schema here: duet-schemas commits it as performance 1.0.
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

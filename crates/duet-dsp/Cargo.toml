[package]
name = "duet-dsp"
version.workspace = true
description = "duet's audio analysis: samples in, events out, as a stream of stages that settle their output as they go. No I/O, codecs or formats."
edition.workspace = true
# MIT, and Apache-2.0 for the Basic Pitch model the package ships (models/basic-pitch/, with
# Spotify's LICENSE and NOTICE beside it).
license = "MIT AND Apache-2.0"
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["music", "audio", "dsp", "pitch", "onset"]
categories = ["multimedia::audio"]
include = ["src/**", "models/**", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
audioadapter-buffers = "5.2.0"
# The basic-pitch reader (feature `basic-pitch`): Spotify's Basic Pitch through an unofficial port,
# its model embedded from models/basic-pitch. 0.1.0, not 0.2.0: 0.2.0 is under seven days old, and
# differs only in its `ort` backend, which duet does not use.
basic-pitch-rs = { version = "=0.1.0", default-features = false, features = ["tract"], optional = true }
duet-core.workspace = true
rubato = "5.1.0"
rustfft = "6.4.1"
# The performance types derive their schema here: duet-schemas commits it as performance 1.0.
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
# A take's digest: the SHA-256 of its decoded samples (take.rs).
sha2 = "0.10.9"
thiserror = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
basic-pitch = ["dep:basic-pitch-rs"]

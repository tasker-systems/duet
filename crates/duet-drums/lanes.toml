[lanes.rimshot] # Electric Snare (a rimshot in Logic, SD3, SSD and Hydrogen)
key = 40
group = "snare"

[lanes.sidestick] # Side Stick
key = 37
group = "snare"
aliases = ["xstick", "cross-stick"]

[lanes.clap] # Hand Clap
key = 39
group = "snare"

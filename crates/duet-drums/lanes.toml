# The built-in `gm` lane map: every General MIDI Level 1 percussion key (35 to 81), on
# channel 10. duet builds this file into the binary.
#
# A lane is a row of a drum grid. `key` is the MIDI note it plays and reads; `aliases` are
# other names a hand-written grid may use for it (matched ignoring case; the grid then uses
# the lane's own name); `group` places its row: rows are written in `order`, then in the
# order lanes appear here. Names are lowercase letters, digits and hyphens, and are never
# note names, because tools disagree on them (Logic calls key 36 C1, REAPER calls it C2).
#
# Each comment gives the GM1 name. GM2 names (keys 27 to 34 and 82 to 87) are left out
# until they are checked against the MMA specification.

channel = 10
order = ["cymbals", "hats", "toms", "snare", "kick", "percussion"]

[lanes.crash] # Crash Cymbal 1
key = 49
group = "cymbals"
aliases = ["cr"]

[lanes.crash-2] # Crash Cymbal 2
key = 57
group = "cymbals"

[lanes.ride] # Ride Cymbal 1
key = 51
group = "cymbals"
aliases = ["rd"]

[lanes.ride-2] # Ride Cymbal 2
key = 59
group = "cymbals"

[lanes.ride-bell] # Ride Bell
key = 53
group = "cymbals"
aliases = ["bell"]

[lanes.china] # Chinese Cymbal
key = 52
group = "cymbals"

[lanes.splash] # Splash Cymbal
key = 55
group = "cymbals"

[lanes.hh] # Closed Hi-Hat
key = 42
group = "hats"
aliases = ["ch", "hhc", "hh-closed", "hat"]

[lanes.hh-open] # Open Hi-Hat
key = 46
group = "hats"
aliases = ["oh", "hho"]

[lanes.hh-pedal] # Pedal Hi-Hat
key = 44
group = "hats"
aliases = ["hhp", "hh-foot"]

[lanes.tom-high] # High Tom
key = 50
group = "toms"

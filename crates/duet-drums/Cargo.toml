[package]
name = "duet-drums"
version = "0.2.0"
description = "The duet drum grid: a lanes × steps velocity matrix, its text form, lane maps, and conversion to and from a duet Song."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["midi", "music", "drums", "llm"]
categories = ["multimedia::audio", "parser-implementations"]
include = ["src/**", "lanes.toml", "Cargo.toml"]

[lints]
workspace = true

[dependencies]
duet-core = { path = "../duet-core", version = "0.2.0" }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# preserve_order keeps a lane map's lanes in the order its file lists them.
toml = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
duet-schemas = { path = "../duet-schemas" }
duet-midi = { path = "../duet-midi", version = "0.2.0" }
serde_json = { version = "1", features = ["float_roundtrip"] }

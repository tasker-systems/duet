[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# The one version every published crate shares, and the repo-root VERSION once a release has cut
# one: tools/scripts/release/update-versions.sh writes both, with every version below (RELEASING.md).
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/tasker-systems/duet"

# The workspace's own crates, at the shared version. A dependency spec cannot inherit
# [workspace.package].version, so each is spelled out, and update-versions.sh moves them together.
# The two dev-dependency cycles back to duet-schemas (from duet-midi and duet-drums) stay path-only
# in their crates, so cargo strips them when it publishes.
[workspace.dependencies]
duet-core = { path = "crates/duet-core", version = "0.2.1" }
duet-midi = { path = "crates/duet-midi", version = "0.2.1" }
duet-abc = { path = "crates/duet-abc", version = "0.2.1" }
duet-drums = { path = "crates/duet-drums", version = "0.2.1" }
duet-dsp = { path = "crates/duet-dsp", version = "0.2.1" }
duet-capture = { path = "crates/duet-capture", version = "0.2.1" }
duet-play = { path = "crates/duet-play", version = "0.2.1" }
duet-schemas = { path = "crates/duet-schemas", version = "0.2.1" }

# The canonical lint table from tasker-systems/conventions (rust/workspace-lints.toml), adopted in
# `table` mode: check A compares it with the projection (CONS-3). Change it there, not here.
[workspace.lints.rust]
# RUST-UNSAFE-1/2: every crate root also declares `#![forbid(unsafe_code)]`. A crate with a
# registered exception omits the `forbid`, and this `deny` makes each of its unsafe sites carry
# `#[expect(unsafe_code, reason = "...")]`. A tripwire pins both sets.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
# RUST-TYPE-1.
missing_debug_implementations = "warn"
redundant_imports = "warn"
# A crate using tokio-console's `--cfg tokio_unstable` (tasker-core's spawn_named!) extends this list
# in its own copy; the shape is: check-cfg = ['cfg(tokio_unstable)'].
unexpected_cfgs = { level = "warn", check-cfg = [] }

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# RUST-LINT-3: silence with #[expect(lint, reason = "...")] only.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# RUST-UNSAFE-2: every unsafe block states its safety argument.
undocumented_unsafe_blocks = "warn"

dbg_macro = "warn"
# CONC-BOUND-1 is enforced through `disallowed_methods`, which is on by default and configured in
# clippy.toml; it is named here so the dependency is visible.
disallowed_methods = "warn"

# Permanent exceptions in the `cargo` group:
# Duplicate versions are pervasive and reported by cargo-deny's `bans` (SC-DENY-3) instead.
multiple_crate_versions = "allow"

# RUST-LINT-5 / RUST-API-3, -4, -5: single lints from the held-off style/complexity groups that
# hold a written rule. Measured 2026-10-23 on lib and bin targets with clippy 1.99: 0 findings in
# temper@d530840 and in tasker-core@3888d42, so each lands without an audit.
ptr_arg = "warn"
borrowed_box = "warn"
should_implement_trait = "warn"
derivable_impls = "warn"
new_without_default = "warn"
len_without_is_empty = "warn"
wrong_self_convention = "warn"
unnecessary_unwrap = "warn"

# Candidates with findings, held until each repo's audit (RUST-LINT-4). Counts are lib and bin
# targets, 2026-10-23, temper / tasker-core. Each needs the clippy.toml setting beside it.
# wildcard_imports = "warn"     # RUST-ORG-1:  4 / 26
# unwrap_used = "warn"          # RUST-ERR-4: 11 / 76 (clippy.toml: allow-unwrap-in-tests = true)
# missing_panics_doc = "warn"   # RUST-DOC-1: 25 / 25 (library crates only)

# Held off in v0. Turning any on is a ruling, adopted per RUST-LINT-4.
# complexity = { level = "warn", priority = -1 }
# perf       = { level = "warn", priority = -1 }
# style      = { level = "warn", priority = -1 }
# pedantic   = { level = "warn", priority = -1 }

"RUST-API-2" = "convention: the libraries are published to crates.io; the open sets are #[non_exhaustive] (the nine Error enums, Control, Song, Track, Note, DrumGrid, LaneDef, duet-dsp's Event, HitLane, LaneMode, PitchFrame, Timing, BeatTempo and KeyEstimate, duet-capture's Kind, Captured, Analysis, QuantizeOffset, Quantized and Merge, duet-core's Dtype, duet-abc's Refusal, Notice, Reading, ReadOptions, WriteOptions, Dynamics, duet-schemas' Envelope, Tool, From, Notice, Document, Stream, AnyDocument, KindInfo and Framing, its journal's By, JournalHead, IndexHead, EntryFrame, EventInfo, Party, Audience, every event body (AskAsked, AskAnswered, AskWithdrawn, MomentPlayed, VerdictGiven, TakeAdded, DocWritten), Event, Entry, Skip, Body, Line, Journal, TakeRef, Concerns, Opens, Closes, IndexLine, IndexEntry and JournalIndex, and duet-bus' Refusal, AskRecord, Refused, Replay, Cut, Appended, Place, Segment, Orphan, ProjectJournal, Cursor, Polled, Unread, Duplicate, Torn, CloseDiffers and Report) and the closed ones are exhaustive (duet-dsp's Chunk and Mono, deliberately, so other crates can build them for their own sources and stages; duet-dsp's Origin and Given and duet-capture's LeadIn, deliberately, since a value is given or estimated, the command line builds a Given, and a lead-in is none, a pickup or rest bars; Position, TimeSig, Key, Mode, the three *Change events, Lane, Levels, Span, duet-play's Event, duet-schemas' Version, and duet-bus' AskState and Step, deliberately, since a change to the ask's lifecycle is a new event version, never an edit to an arm); Book, Tune, duet-core's Tensor, duet-play's Message, Schedule and Renderer, duet-schemas' Id, At, RelPath and SegmentStamp, and duet-bus' Writer and Tail have private fields; a new public type is judged in review"

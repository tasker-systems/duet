mode = "table"
table = "workspace.lints"
canonical_table = "workspace.lints"

[[adopted]]
canonical = "rust/clippy.toml"
path = "clippy.toml"
mode = "exact"

[[adopted]]
canonical = "rust/deny.toml"
path = "deny.toml"
mode = "exact"

[[adopted]]
canonical = "rust/audit.toml"
path = ".cargo/audit.toml"
mode = "exact"

[[adopted]]
canonical = "ci/conventions-bump.yml"
path = ".github/workflows/conventions-bump.yml"
mode = "exact"

[guidance]
# Agent entry files that must link the projected skill, and where the skill is projected.
entry = ["CLAUDE.md"]

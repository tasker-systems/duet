# cargo-nextest configuration. `cargo nextest run` is how the tests run, locally and in CI
# (README, .github/workflows/ci.yml#check). nextest does not run doctests, so CI runs them with
# `cargo test --doc` beside each nextest step.

# Setup scripts are still experimental in nextest 0.9.151, the version CI pins.
experimental = ["setup-scripts"]

[profile.default]
# A test running longer than 60s is reported SLOW, and one still running at 180s is killed.
# The slowest test today, duet-capture's held pass under every reader, takes about 30s on a
# 10-core machine and about twice that on a CI runner. A test that hangs fails with its name
# instead of running into the job's timeout.
slow-timeout = { period = "60s", terminate-after = 3 }

# CI runs every nextest step with `--profile ci`.
[profile.ci]
# Report every failure in the run, not only the first.
fail-fast = false
# List the slow tests again at the end of the run, so a test that creeps toward the kill
# shows in the summary before it reaches it.
final-status-level = "slow"
# No retries. A test that fails once fails the run, so TEST-4 (retries are reported) stays
# n/a. Adding retries means reporting each flaky test as a CI annotation first, as temper does.
retries = 0

# duet-e2e runs the working tree's `duet` binary. Under cargo test, each test binary builds it
# once per process (crates/duet-e2e/src/lib.rs). Under nextest, every test is its own process,
# so concurrent builds would relink target/debug/duet while another test executes it. That was
# observed as `run duet: NotFound`. This script builds the binary once, before any duet-e2e test
# starts, and hands its path to every test as DUET_E2E_BIN. A DUET_E2E_BIN already set, such
# as a binary built from `main`, is left as it is.
[scripts.setup.duet-bin]
command = "bash scripts/nextest-duet-bin.sh"

[[profile.default.scripts]]
filter = "package(duet-e2e)"
setup = "duet-bin"

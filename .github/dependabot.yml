# Dependency updates for every ecosystem in the repository (SC-IN-2): the Actions pins and the
# cargo lockfile, grouped weekly. A new ecosystem (a Python or JS tool, a Dockerfile) gets an
# entry here in the same change that adds it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # The conventions bump workflow is adopted `exact` from tasker-systems/conventions (CONS-9):
    # its pins move in the baseline and arrive with a pin bump. A Dependabot edit here would
    # fail the conventions check (check A) on every update.
    exclude-paths:
      - .github/workflows/conventions-bump.yml
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

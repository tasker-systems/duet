name: CI

# `CI Success` is the one required check (CI-2). `scope` decides whether a change is docs only,
# with ci-scope.sh beside this file; for a docs-only change the jobs that compile are skipped. `gate`
# (CI-1) and `secrets` run on every change, docs included. Detection fails closed: anything the
# script is unsure of, any event but pull_request and merge_group, and an error in the `scope` job
# all run everything, and a change to the workflows or the script is never docs only.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  # Decides whether the change is docs only. Its one output, `docs_only`, is `true` only when
  # ci-scope.sh printed `docs` and exited 0; every other outcome leaves it `false`. The jobs that
  # skip read the output as `!= 'true'`, so an empty output (this job failed) runs them too.
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the diff and their merge base must be in the checkout.
          fetch-depth: 0
          persist-credentials: false
      - name: Docs-only change?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          docs_only=false
          if decision="$(bash .github/workflows/ci-scope.sh "$EVENT" "$BASE" "$HEAD")"; then
            if [ "$decision" = docs ]; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # Stage 1 (CI-1): no compilation. Formatting, the conventions checks, and the supply-chain
  # gates, which the compiling jobs wait on.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      # Tool versions are pinned, and each was at least 7 days old when pinned (SC-IN-1).
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Lockfile matches the manifests (SC-IN-3)
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: rustfmt (RUST-FMT-1)
        run: cargo fmt --all --check
      - name: Conventions check (CONS-1..8)
        run: python3 -I .conventions/baseline/tools/conventions.py check
      - name: Conventions witness (TW-5)
        run: python3 -I .conventions/baseline/tools/conventions.py witness
      - name: Roadmap snapshot witnesses (ROAD-1, ROAD-2, ROAD-5)
        run: bash tools/roadmap/test.sh
      - name: Release API check bite test (COMPAT-1, COMPAT-2)
        run: bash tools/scripts/release/test-api-check.sh
      - name: Capture fixtures script keeps committed fixtures
        run: bash scripts/test-capture-fixtures.sh
      - name: cargo deny (SC-DENY-1..3)
        run: cargo deny --locked check sources licenses bans
      - name: cargo audit (SC-ADV-1)
        run: cargo audit

  # SC-SEC-1: gitleaks over the full history, on every change. It is a separate job rather than a
  # step in `gate` for two reasons. It needs a full-depth checkout, which `gate` does not. And
  # `gate` runs the conventions check, so it must reference no secret (CONS-8). Keeping the scan
  # apart means a later switch to a token-using scanner cannot land in `gate`. It runs alongside
  # `gate`, and `ci-success` needs it, so a docs-only change is scanned too.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pinned by version and by the module hash that sum.golang.org records for it (SC-IN-1).
      # v8.30.0 was published 2025-11-26. v8.30.1 is not used: its tag was moved after the
      # checksum database recorded it, so the tag and the recorded module now disagree.
      GITLEAKS_VERSION: v8.30.0
      GITLEAKS_SUM: h1:5heLlxRQkHfXgTJgdQsJhi/evX1oj6i+xBanDu2XUM8=
      # gitleaks needs go >= 1.25.4. Without a pin, the Go on the runner would fetch the newest
      # toolchain. go1.26.11 was published 2026-11-02, and sum.golang.org verifies it too.
      GOTOOLCHAIN: go1.26.11
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          bin="$(go env GOPATH)/bin/gitleaks"
          got="$(go version -m "$bin" | awk '$1 == "mod" { print $3, $4 }')"
          if [ "$got" != "${GITLEAKS_VERSION} ${GITLEAKS_SUM}" ]; then
            echo "gitleaks module is '$got', expected '${GITLEAKS_VERSION} ${GITLEAKS_SUM}'"
            exit 1
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: gitleaks (SC-SEC-1)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  # The compiling jobs below run in parallel, each building only what it needs: clippy's
  # check-mode build shares nothing with a test build, and each feature set is a build of its
  # own. Each is skipped for a docs-only change. `!cancelled()` lets it run when `scope` failed,
  # which is the fail-closed path; it still waits on `gate` passing.

  # Lints and docs. --all-features compiles and lints duet-abc's oracle tier, which needs abc2midi
  # and so never runs here (TEST-3): its drift gate runs in `test`.
  lint:
    name: Clippy and docs
    needs: [gate, scope]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: Clippy (RUST-LINT-1, RUST-LINT-2)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: rustdoc (RUST-LINT-2)
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The workspace's tests. nextest runs every test as its own process, all binaries at once,
  # under the ci profile in .config/nextest.toml. It does not run doctests, so `cargo test --doc`
  # follows. duet-e2e's setup script builds `duet` as `cargo build -p duet-cli` does, the binary
  # a user installs, rather than with the test build's features: so it compiles apart.
  test:
    name: Tests
    needs: [gate, scope]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          nextest: "true"
      - name: Tests
        run: cargo nextest run --locked --profile ci
      - name: Doctests
        run: cargo test --locked --doc

  # duet-cli builds the basic-pitch reader by default, which turns the feature on for the whole
  # workspace in `lint` and `test`. Build, lint and test once without it, so the build without a
  # model keeps working.
  test-no-basic-pitch:
    name: Without the basic-pitch reader
    needs: [gate, scope]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          nextest: "true"
      - name: Clippy without the basic-pitch reader
        run: cargo clippy --locked -p duet-cli --all-targets --no-default-features -- -D warnings
      - name: Tests without the basic-pitch reader
        run: |
          cargo nextest run --locked --profile ci -p duet-dsp -p duet-capture -p duet-actions -p duet-cli --no-default-features
          cargo test --locked --doc -p duet-dsp -p duet-capture --no-default-features

  # duet reads config from the user's directory and from a .duet above the working directory.
  # The tests must not: a developer's own duet.toml must never change what they check. So run
  # duet-actions', duet-cli's and duet-e2e's tests again under a hostile config in both places. duet-e2e's
  # nextest setup script builds the duet binary once for the run, so its tests run the working
  # tree's binary, never a stale one.
  test-hostile-config:
    name: Tests ignore the developer's config
    needs: [gate, scope]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          nextest: "true"
      - name: duet-cli and duet-e2e tests under a hostile config
        env:
          DUET_CONFIG_DIR: ${{ github.workspace }}/crates/duet-e2e/hostile
        run: |
          mkdir .duet
          cp crates/duet-e2e/hostile/duet.toml .duet/
          cargo nextest run --locked --profile ci -p duet-actions -p duet-cli -p duet-e2e
          cargo test --locked --doc -p duet-e2e
          rm -r .duet

  # Skipped for a docs-only change, on the same condition as the jobs above.
  msrv:
    name: Builds on the declared rust-version
    needs: [gate, scope]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep this in step with `rust-version` in Cargo.toml (RUST-TC-1).
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.100"
      - run: cargo check --locked --all-targets

  # Passes only if `scope`, `gate` and `secrets` succeeded, and every compiling job succeeded or
  # was skipped because `scope` found the change docs only. Skipped for any other reason (`gate`
  # failed, say), failed or cancelled is a failure. A new compiling job belongs in `needs` and in
  # the second loop below, or it gates nothing.
  ci-success:
    name: CI Success
    if: always()
    needs: [scope, gate, secrets, lint, test, test-no-basic-pitch, test-hostile-config, msrv]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every in-scope job passed
        env:
          SCOPE: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          GATE: ${{ needs.gate.result }}
          SECRETS: ${{ needs.secrets.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          TEST_NO_BASIC_PITCH: ${{ needs.test-no-basic-pitch.result }}
          TEST_HOSTILE_CONFIG: ${{ needs.test-hostile-config.result }}
          MSRV: ${{ needs.msrv.result }}
        run: |
          echo "scope=$SCOPE docs_only=$DOCS_ONLY gate=$GATE secrets=$SECRETS lint=$LINT test=$TEST"
          echo "test-no-basic-pitch=$TEST_NO_BASIC_PITCH test-hostile-config=$TEST_HOSTILE_CONFIG msrv=$MSRV"
          failed=0
          for job in "scope=$SCOPE" "gate=$GATE" "secrets=$SECRETS"; do
            if [ "${job#*=}" != success ]; then
              echo "${job%%=*} did not succeed: it runs on every change"
              failed=1
            fi
          done
          for job in "lint=$LINT" "test=$TEST" "test-no-basic-pitch=$TEST_NO_BASIC_PITCH" \
            "test-hostile-config=$TEST_HOSTILE_CONFIG" "msrv=$MSRV"; do
            result="${job#*=}"
            if [ "$result" = success ]; then
              continue
            fi
            if [ "$result" = skipped ] && [ "$SCOPE" = success ] && [ "$DOCS_ONLY" = true ]; then
              echo "${job%%=*} skipped: the change is docs only"
              continue
            fi
            echo "${job%%=*} is $result, and the change is not docs only"
            failed=1
          done
          exit "$failed"

name: CI

# `CI Success` is the one required check (CI-2). Every job below is always in scope: the
# workspace is one small crate, so there is no change-scope detection to fail open.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  # Stage 1 (CI-1): no compilation. Formatting, the conventions checks, and the supply-chain
  # gates, which the expensive job waits on.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      # Tool versions are pinned, and each was at least 7 days old when pinned (SC-IN-1).
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Lockfile matches the manifests (SC-IN-3)
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: rustfmt (RUST-FMT-1)
        run: cargo fmt --all --check
      - name: Conventions check (CONS-1..8)
        run: python3 -I .conventions/baseline/tools/conventions.py check
      - name: Conventions witness (TW-5)
        run: python3 -I .conventions/baseline/tools/conventions.py witness
      - name: cargo deny (SC-DENY-1..3)
        run: cargo deny --locked check sources licenses bans
      - name: cargo audit (SC-ADV-1)
        run: cargo audit

  check:
    name: Clippy, docs and tests
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - name: Clippy (RUST-LINT-1, RUST-LINT-2)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: rustdoc (RUST-LINT-2)
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Tests
        run: cargo test --locked

  msrv:
    name: Builds on the declared rust-version
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep this in step with `rust-version` in Cargo.toml (RUST-TC-1).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.100"
      - run: cargo check --locked --all-targets

  ci-success:
    name: CI Success
    if: always()
    needs: [gate, check, msrv]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done

name: CI

# `CI Success` is the one required check (CI-2). Every job below is always in scope: the
# workspace is one small crate, so there is no change-scope detection to fail open.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  # Stage 1 (CI-1): no compilation. Formatting, the conventions checks, and the supply-chain
  # gates, which the expensive job waits on.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      # Tool versions are pinned, and each was at least 7 days old when pinned (SC-IN-1).
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Lockfile matches the manifests (SC-IN-3)
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: rustfmt (RUST-FMT-1)
        run: cargo fmt --all --check
      - name: Conventions check (CONS-1..8)
        run: python3 -I .conventions/baseline/tools/conventions.py check
      - name: Conventions witness (TW-5)
        run: python3 -I .conventions/baseline/tools/conventions.py witness
      - name: cargo deny (SC-DENY-1..3)
        run: cargo deny --locked check sources licenses bans
      - name: cargo audit (SC-ADV-1)
        run: cargo audit

  # SC-SEC-1: gitleaks over the full history, on every change. It is a separate job rather than a
  # step in `gate` for two reasons. It needs a full-depth checkout, which `gate` does not. And
  # `gate` runs the conventions check, so it must reference no secret (CONS-8). Keeping the scan
  # apart means a later switch to a token-using scanner cannot land in `gate`. It runs alongside
  # `gate`, and `ci-success` needs it, so a docs-only change is scanned too.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pinned by version and by the module hash that sum.golang.org records for it (SC-IN-1).
      # v8.30.0 was published 2025-11-26. v8.30.1 is not used: its tag was moved after the
      # checksum database recorded it, so the tag and the recorded module now disagree.
      GITLEAKS_VERSION: v8.30.0
      GITLEAKS_SUM: h1:5heLlxRQkHfXgTJgdQsJhi/evX1oj6i+xBanDu2XUM8=
      # gitleaks needs go >= 1.25.4. Without a pin, the Go on the runner would fetch the newest
      # toolchain. go1.26.11 was published 2026-11-02, and sum.golang.org verifies it too.
      GOTOOLCHAIN: go1.26.11
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          bin="$(go env GOPATH)/bin/gitleaks"
          got="$(go version -m "$bin" | awk '$1 == "mod" { print $3, $4 }')"
          if [ "$got" != "${GITLEAKS_VERSION} ${GITLEAKS_SUM}" ]; then
            echo "gitleaks module is '$got', expected '${GITLEAKS_VERSION} ${GITLEAKS_SUM}'"
            exit 1
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: gitleaks (SC-SEC-1)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  check:
    name: Clippy, docs and tests
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      # duet play's cpal and midir build against ALSA on Linux, by the owner's decision.
      # Exact versions from Ubuntu 24.04's archive (SC-IN-1). libasound2-dev is the
      # noble-updates/-security build of 2026-07-14, and pkg-config noble's release build.
      # Ubuntu lists only the newest build in noble-updates, so this step fails, loudly, once
      # a newer one replaces 1.2.11-1ubuntu0.3 there. Then pin the new build, once it is at
      # least 7 days old: `apt-cache policy libasound2-dev` on the runner names it.
      - name: ALSA headers for duet play
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev=1.2.11-1ubuntu0.3 pkg-config=1.8.1-2build1
      # --all-features compiles and lints duet-abc's oracle tier, which needs abc2midi and so
      # never runs here (TEST-3): its drift gate runs in the plain tests below.
      - name: Clippy (RUST-LINT-1, RUST-LINT-2)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: rustdoc (RUST-LINT-2)
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Tests
        run: cargo test --locked
      # duet reads config from the user's directory and from a .duet above the working
      # directory. The tests must not: a developer's own duet.toml must never change what
      # they check. So run them again under a hostile config in both places.
      # duet-e2e builds the duet binary itself and drives it, so its tests run the working
      # tree's binary, never a stale one.
      - name: duet-cli and duet-e2e tests ignore the developer's config
        run: |
          mkdir .duet
          cp crates/duet-e2e/hostile/duet.toml .duet/
          DUET_CONFIG_DIR="$PWD/crates/duet-e2e/hostile" cargo test --locked -p duet-cli -p duet-e2e
          rm -r .duet

  msrv:
    name: Builds on the declared rust-version
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep this in step with `rust-version` in Cargo.toml (RUST-TC-1).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.100"
      # duet play's cpal and midir build against ALSA on Linux, by the owner's decision.
      # Exact versions from Ubuntu 24.04's archive (SC-IN-1). libasound2-dev is the
      # noble-updates/-security build of 2026-07-14, and pkg-config noble's release build.
      # Ubuntu lists only the newest build in noble-updates, so this step fails, loudly, once
      # a newer one replaces 1.2.11-1ubuntu0.3 there. Then pin the new build, once it is at
      # least 7 days old: `apt-cache policy libasound2-dev` on the runner names it.
      - name: ALSA headers for duet play
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev=1.2.11-1ubuntu0.3 pkg-config=1.8.1-2build1
      - run: cargo check --locked --all-targets

  ci-success:
    name: CI Success
    if: always()
    needs: [gate, secrets, check, msrv]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done

name: CodeQL

# SC-SEC-1: static analysis on every pull request and weekly, so new queries reach unchanged code.
# This runs outside `CI Success`. Its findings go to code scanning, and they block a merge only
# once the owner sets a code scanning merge protection rule.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The analysis is uploaded to code scanning, which needs write access to security events.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # rust: the workspace. actions: the workflows themselves (injection, token scope).
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

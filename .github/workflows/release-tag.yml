name: Release Tag

# The one door a release goes through: a release PR (cargo make release-prepare) changes VERSION,
# and its merge to main runs this. It pushes the v<VERSION> tag and calls release.yml, which
# publishes the crates and creates the GitHub Release. Borrowed from temper's release-tag.yml.
#
# Its triggers are pinned (SC-GHA-3): this workflow and release.yml are the ones that can mint a
# crates.io credential, so a new trigger is a new way to reach it. RELEASING.md lists them.

on:
  push:
    branches: [main]
    paths: [VERSION]

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Pushes the release tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # read-version.sh refuses a VERSION that is not semver, before it becomes a tag name.
      - name: Read VERSION
        id: read
        run: ./tools/scripts/release/read-version.sh >> "$GITHUB_OUTPUT"

      # Values reach the scripts as environment variables, never as an expression inside `run:`:
      # GitHub expands an expression into the script's text before bash parses it.
      - name: Derive tag name
        id: derive
        env:
          VERSION: ${{ steps.read.outputs.VERSION }}
        run: echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        id: create
        env:
          TAG: ${{ steps.derive.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping." >&2
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  # Called directly: a tag pushed with GITHUB_TOKEN triggers no workflow, so release.yml has no
  # tag-push trigger to rely on.
  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    # A called workflow's permissions are capped by this job's. release.yml's publish job needs
    # id-token: write for crates.io trusted publishing, its release job contents: write, and its
    # determine-version job actions: read for the release-commit check.
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

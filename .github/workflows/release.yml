name: Release

# Publishes a tagged release: duet's crates to crates.io, then a GitHub Release. Borrowed from
# temper's release.yml, cut down to its crates lane.
#
# Two doors, both pinned (SC-GHA-3): the call from release-tag.yml, the normal path, and
# workflow_dispatch, to re-run a tag whose release failed partway. Re-runs are idempotent:
# publish-crates.sh skips every version crates.io already lists.
#
# The crates lane is two jobs. build-crates runs the API check (api-check.sh) on the tagged
# candidate, then verify-compiles every crate, which runs third-party build scripts, and holds no
# id-token. publish-crates holds id-token: write, compiles nothing, and pushes only bytes it has
# checked against build-crates' hashes (artifact-sums.sh). When crates.io already has every crate
# at the version, nothing is built for it to publish, and it does not run: no credential is
# minted. That is how the first release, published from a
# maintainer's machine before its PR merged (RELEASING.md), still gets its tag and Release.
#
# Every external action is pinned by full commit SHA with its tag as a trailer (SC-GHA-1).

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  determine-version:
    name: Determine version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # The tag arrives as an environment variable, never inside the script's text. The tagged
      # tree's VERSION must name the same version, so a dispatch cannot release a tag under
      # another version's sources.
      - name: Check the tag against VERSION
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          eval "$(./tools/scripts/release/read-version.sh)"
          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "The tag ${TAG} does not match VERSION ${VERSION} in its tree." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-crates:
    name: Verify crates
    needs: determine-version
    runs-on: ubuntu-24.04
    # The API check builds rustdoc for every library crate twice, the candidate and its baseline.
    timeout-minutes: 60
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
      count: ${{ steps.sums.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.determine-version.outputs.tag }}
          # The API check places the last release in this clone's history (COMPAT-2): it needs
          # the full history and every tag, and refuses a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # duet-play's cpal and midir build against ALSA on Linux, and verify-packaging compiles
      # them. The same pins as ci.yml's step of this name (SC-IN-1); move both together.
      - name: ALSA headers for duet play
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev=1.2.11-1ubuntu0.3 pkg-config=1.8.1-2build1
      # Pinned, and at least 7 days old when pinned (SC-IN-1): 0.51.0 was published 2026-10-03.
      # cargo-semver-checks reads rustdoc's JSON, whose format moves with the toolchain, so a new
      # stable it cannot read refuses the release until this pin moves.
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-semver-checks@0.51.0
      # The pre-publish API check (COMPAT-1) on the tagged candidate, before anything is packaged:
      # each library crate against the last release on crates.io, at the bump VERSION declares.
      # It refuses, and nothing is published, on a break the bump does not admit, and on any
      # crates.io or tag lookup it cannot complete.
      - name: API check against the last release
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: ./tools/scripts/release/api-check.sh "$VERSION"
      - name: Verify-package every crate crates.io lacks
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: ./tools/scripts/release/publish-crates.sh "$VERSION" --out dist
      # The hashes leave this job as a job output, which no other job can write: the publish job
      # checks its download against them.
      - name: Record the packages' hashes
        id: sums
        run: |
          {
            echo 'sums<<SUMS_EOF'
            ./tools/scripts/release/artifact-sums.sh emit dist
            echo 'SUMS_EOF'
            echo "count=$(find dist -maxdepth 1 -name '*.crate' | wc -l | tr -d ' ')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crates-${{ needs.determine-version.outputs.version }}
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

  publish-crates:
    name: Publish crates
    needs: [determine-version, build-crates]
    if: needs.build-crates.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # id-token: write is crates.io trusted publishing: the auth action exchanges this job's OIDC
    # token for a short-lived upload token. No registry secret exists.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.determine-version.outputs.tag }}
          persist-credentials: false
      # The same toolchain as build-crates: packaging must reproduce its bytes.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates-${{ needs.determine-version.outputs.version }}
          path: dist/
      - name: Check the download against build-crates' hashes
        env:
          SUMS: ${{ needs.build-crates.outputs.sums }}
        run: ./tools/scripts/release/artifact-sums.sh verify dist
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: ./tools/scripts/release/publish-crates.sh "$VERSION" --from dist

  github-release:
    name: GitHub Release
    needs: [determine-version, build-crates, publish-crates]
    # After the crates are published, or when there was nothing to publish.
    if: >-
      always() && needs.build-crates.result == 'success' &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Creates the Release.
    permissions:
      contents: write
    steps:
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.determine-version.outputs.tag }}
          BUILT: ${{ needs.build-crates.outputs.count }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "The Release ${TAG} exists; left as it is."
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes --title "duet ${TAG}"
          fi
          {
            echo "## Release ${TAG}"
            echo ""
            echo "Crates this run published: ${BUILT}. Any others were already on crates.io at this version."
          } >> "$GITHUB_STEP_SUMMARY"
